name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    # The checks of the development harness (.claude/rules/progress-log.md; standard library only)
    # and ruff (in its own image, scripts/lint.sh): they need neither the conda environment nor the
    # image of cuFEP.
    name: harness (checks of the development harness, ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PROGRESS.md size budget and layout
        run: python scripts/check_progress_size.py
      - name: README.md and README.ja.md have the same headings, commands and links
        run: python scripts/check_readme_pair.py
      - name: Names of commercial FEP products only for accuracy and sources
        run: python scripts/check_names.py
      - name: Lint (ruff, pinned in scripts/lint.sh)
        run: scripts/lint.sh

  unit:
    name: unit tests (CPU, stock OpenMM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONDA_OVERRIDE_CUDA: "13.4"
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: docker/environment.yml
          cache-environment: true
      - name: Install cuFEP
        run: pip install --no-deps -e .
      - name: Unit tests
        run: pytest tests/unit -q
