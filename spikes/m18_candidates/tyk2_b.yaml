# Candidate B of plan docs/plans/2026-11-21-als-initial-window-design.md, on the TYK2 example
# (examples/kinase_tyk2/config.yaml: ligand ejm_31, 5 ns of production per lambda window).
# Complex leg: adaptive lambda scheduling starts from 30 windows placed with a density
# proportional to (where it put windows in stored legs) x sqrt(statistical inefficiency there),
# and reads the overlap of each pair of neighbouring windows alone, with a threshold of 0.30.
# The values are those of
#   spikes/m18_window_design.py runs/benchmark_tyk2_full runs/benchmark_a2a_full \
#       runs/tyk2_interactions_720cdb1 runs/tyk2_spread_1b770da_{1,2,3} --windows 30 59
# (37 complex legs, adaptive lambda scheduling with the threshold 0.18, 5 ns of production).
# Solvent leg: as the example (the defaults).
system:
  protein: ../../examples/kinase_tyk2/protein.pdb
  ligand: ../../examples/kinase_tyk2/ligand.sdf
sampling:
  production_ns: 5.0
lambda_schedule:
  adaptive:
    overlap_threshold: {complex: 0.30, solvent: 0.18}
    overlap_matrix: {complex: pair, solvent: stage}
    initial_windows:
      complex:
        restrain: [0.0, 0.13, 0.26, 0.46, 0.73, 1.0]
        discharge: [0.0, 0.16, 0.33, 0.51, 0.73, 1.0]
        vanish: [0.0, 0.15, 0.29, 0.41, 0.52, 0.61, 0.67, 0.72, 0.75, 0.77, 0.79, 0.8, 0.82, 0.83, 0.85,
                 0.86, 0.88, 0.92, 0.96, 1.0]
output:
  dir: runs/tyk2_windows_b
