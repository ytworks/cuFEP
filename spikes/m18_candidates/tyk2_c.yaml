# Candidate C of plan docs/plans/2026-11-21-als-initial-window-design.md, on the TYK2 example
# (examples/kinase_tyk2/config.yaml: ligand ejm_31, 5 ns of production per lambda window).
# Complex leg: as candidate B with 59 windows to start with (the same density, twice the
# windows); the overlap of each pair of neighbouring windows alone, with a threshold of 0.30.
# The values are those of
#   spikes/m18_window_design.py runs/benchmark_tyk2_full runs/benchmark_a2a_full \
#       runs/tyk2_interactions_720cdb1 runs/tyk2_spread_1b770da_{1,2,3} --windows 30 59
# Between lambda 0.72 and 0.94 of the vanish stage every candidate (0.01 apart) is a window, so
# adaptive lambda scheduling cannot add one there.
# Solvent leg: as the example (the defaults).
system:
  protein: ../../examples/kinase_tyk2/protein.pdb
  ligand: ../../examples/kinase_tyk2/ligand.sdf
sampling:
  production_ns: 5.0
lambda_schedule:
  adaptive:
    overlap_threshold: {complex: 0.30, solvent: 0.18}
    overlap_matrix: {complex: pair, solvent: stage}
    initial_windows:
      complex:
        restrain: [0.0, 0.06, 0.13, 0.19, 0.26, 0.35, 0.46, 0.59, 0.73, 0.87, 1.0]
        discharge: [0.0, 0.08, 0.16, 0.24, 0.33, 0.42, 0.51, 0.61, 0.73, 0.86, 1.0]
        vanish: [0.0, 0.08, 0.15, 0.22, 0.29, 0.36, 0.41, 0.47, 0.52, 0.57, 0.61, 0.64, 0.67, 0.7, 0.72,
                 0.73, 0.75, 0.76, 0.77, 0.78, 0.79, 0.8, 0.81, 0.82, 0.83, 0.84, 0.85, 0.86, 0.87, 0.88, 0.89,
                 0.9, 0.91, 0.92, 0.93, 0.94, 0.96, 0.98, 1.0]
output:
  dir: runs/tyk2_windows_c
