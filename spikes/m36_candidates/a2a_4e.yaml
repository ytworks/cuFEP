# The A2A example (examples/membrane_a2a/config.yaml: compound 4e in a POPC bilayer, 5 ns of
# production per lambda window) with `lambda_schedule.adaptive.method: thermodynamic_length` in both
# legs (the rule of each leg as it is, and windows added until neighbours are also a step of the
# thermodynamic length apart or less): the run V3 of plan
# docs/plans/2026-11-25-thermodynamic-length-schedule.md. Everything else is the example's.
#   IMAGE=cufep:<commit> spikes/run_frozen.sh run spikes/m36_candidates/a2a_4e.yaml -o runs/<name>
system:
  protein: ../../examples/membrane_a2a/protein.pdb
  ligand: ../../examples/membrane_a2a/ligand.sdf
membrane:
  enabled: true
sampling:
  production_ns: 5.0
lambda_schedule:
  adaptive:
    method: thermodynamic_length
output:
  dir: runs/a2a_tl
