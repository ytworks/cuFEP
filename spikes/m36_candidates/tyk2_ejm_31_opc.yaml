# The TYK2 example (examples/kinase_tyk2/config.yaml: ligand ejm_31, 5 ns of production per lambda
# window) with the water model OPC and `lambda_schedule.adaptive.method: thermodynamic_length` in both
# legs: the owner's order of 2026-11-25, after the runs V1 and V2 of plan
# docs/plans/2026-11-25-thermodynamic-length-schedule.md. Everything else is the example's.
#   IMAGE=cufep:<commit> spikes/run_frozen.sh run spikes/m36_candidates/tyk2_ejm_31_opc.yaml -o runs/<name>
system:
  protein: ../../examples/kinase_tyk2/protein.pdb
  ligand: ../../examples/kinase_tyk2/ligand.sdf
forcefield:
  water: amber14/opc.xml
sampling:
  production_ns: 5.0
lambda_schedule:
  adaptive:
    method: thermodynamic_length
output:
  dir: runs/tyk2_tl_opc
