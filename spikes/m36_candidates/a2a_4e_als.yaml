# The control of spikes/m36_candidates/a2a_4e.yaml: the A2A example (compound 4e in a POPC bilayer, 5 ns of
# production per lambda window) with the present method of lambda scheduling, run from the same image before
# the run with `lambda_schedule.adaptive.method: thermodynamic_length`, so that the two differ by the method
# alone. Everything else is the example's.
#   IMAGE=cufep:<commit> spikes/run_frozen.sh run spikes/m36_candidates/a2a_4e_als.yaml -o runs/<name>
system:
  protein: ../../examples/membrane_a2a/protein.pdb
  ligand: ../../examples/membrane_a2a/ligand.sdf
membrane:
  enabled: true
sampling:
  production_ns: 5.0
output:
  dir: runs/a2a_als
