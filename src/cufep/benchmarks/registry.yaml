# Benchmark sets. Paths are relative to the cuFEP data root (the repository, or
# /opt/cufep inside the official image; override with the CUFEP_DATA variable).
# `example` is the configuration whose settings the set runs with: everything in it but the
# input files, the choice of ligands and the output directory (the smoke tier also shortens the
# sampling); its ligand is one of the set's.
# `subset` lists five ligands evenly spaced by experimental rank; it was fixed before any
# benchmark calculation was run.
tyk2:
  title: TYK2 kinase (PDB 4GIH), Schrödinger public benchmark jacs_set/tyk2
  example: examples/kinase_tyk2/config.yaml
  protein: benchmarks/tyk2/inputs/tyk2_protein.pdb
  ligands: benchmarks/tyk2/ligands.sdf
  reference: benchmarks/tyk2/ligands.csv
  subset: [jmc_23, jmc_30, ejm_45, ejm_48, ejm_44]
a2a:
  title: Adenosine A2A receptor (PDB 5OLZ) in a POPC bilayer, Schrödinger public benchmark gpcrs/a2a_hip278
  example: examples/membrane_a2a/config.yaml
  protein: benchmarks/a2a/inputs/a2a_hip278_protein.pdb
  ligands: benchmarks/a2a/ligands.sdf
  reference: benchmarks/a2a/ligands.csv
  subset: [4e, 4c, 4g, 4d, 4q]
