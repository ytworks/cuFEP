# TYK2 kinase (PDB 4GIH) with ligand ejm_31 from the Schrödinger public benchmark.
# Experimental binding free energy: -9.54 kcal/mol.
# 5 ns of production per lambda window (the default is 10 ns; docs/configuration.md,
# sampling.production_ns). Every setting not listed here uses its recommended default.
# The TYK2 benchmark set runs with the settings of this file (`cufep benchmark run tyk2`).
system:
  protein: protein.pdb
  ligand: ligand.sdf
sampling:
  production_ns: 5.0
output:
  dir: runs/tyk2_ejm_31
