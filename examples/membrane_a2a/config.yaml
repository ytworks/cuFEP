# Adenosine A2A receptor (GPCR, PDB 5OLZ) with compound 4e from the Schrödinger public benchmark.
# Experimental binding free energy: -12.07 kcal/mol.
# `membrane.enabled: true` asks cuFEP to embed the complex in a POPC bilayer.
# 5 ns of production per lambda window (the default is 10 ns; docs/configuration.md,
# sampling.production_ns). Every setting not listed here uses its recommended default.
# The A2A benchmark set runs with the settings of this file (`cufep benchmark run a2a`).
system:
  protein: protein.pdb
  ligand: ligand.sdf
membrane:
  enabled: true
sampling:
  production_ns: 5.0
output:
  dir: runs/a2a_4e
